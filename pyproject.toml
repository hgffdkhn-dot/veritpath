[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veritpath"
version = "0.1.0"
description = "Analyze Android boot/init_boot/vendor_boot images, detect the root layout and inject third-party su/init payloads correctly."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "veritpath contributors" }]
keywords = ["android", "boot.img", "init_boot", "vendor_boot", "root", "magisk", "gki"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Archiving :: Packaging",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "build", "pyinstaller>=6.0"]
yaml = ["pyyaml"]

[project.scripts]
veritpath = "veritpath.cli:main"

[project.urls]
Homepage = "https://github.com/<your-account>/veritpath"
Issues = "https://github.com/<your-account>/veritpath/issues"

[tool.setuptools.packages.find]
include = ["veritpath*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E731"]

[tool.pyinstaller]
# used by scripts/build.sh
