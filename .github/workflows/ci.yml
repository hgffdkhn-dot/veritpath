name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build natively
        run: make
      - name: Regression suite
        run: bash tests/run.sh build/veritpath
      - name: Build with clang and -Werror
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang
          make clean
          make CC=clang CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror"
          bash tests/run.sh build/veritpath
      - name: Cross-compile checks
        run: |
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64
          bash build.sh linux-aarch64
          bash build.sh windows-x86_64

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttl/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
      - name: Build every Android ABI
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash build.sh android
      - uses: actions/upload-artifact@v4
        with:
          name: veritpath-android
          path: dist/veritpath-android-*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          make
          bash tests/run.sh build/veritpath
      - name: Universal binary
        run: |
          mkdir -p dist
          cc -O2 -std=c11 -Wall -Wextra -Isrc -arch x86_64 src/*.c -lz -o dist/veritpath-macos-x86_64
          cc -O2 -std=c11 -Wall -Wextra -Isrc -arch arm64  src/*.c -lz -o dist/veritpath-macos-arm64
          lipo -create -output dist/veritpath-macos-universal dist/veritpath-macos-x86_64 dist/veritpath-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: veritpath-macos
          path: dist/veritpath-macos-*
