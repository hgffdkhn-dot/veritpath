name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build natively
        run: make

      - name: Regression suite
        run: bash tests/run.sh build/veritpath

      # Truncated images read past the buffer at fixed header offsets before;
      # this must stay green.
      - name: Truncation fuzzer under ASan + UBSan
        run: |
          make fuzz-asan

      - name: Strict build (clang, -Werror) and rerun
        run: |
          make clean
          make CC=clang CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror"
          bash tests/run.sh build/veritpath

      - name: Static build
        run: |
          make clean
          make static
          ./build/veritpath doctor

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64

      - name: Cross-compile (missing toolchains are skipped, not fatal)
        run: |
          bash build.sh linux-aarch64
          bash build.sh windows-x86_64

      - name: Regression suite against the native binary
        run: |
          make clean && make
          bash tests/run.sh build/veritpath

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No third-party setup action: the NDK is installed with the sdkmanager
      # that ships with the runner's Android SDK. build-android.sh does this
      # itself when ANDROID_NDK_HOME is unset, so nothing else is needed here.
      - name: Build every Android ABI
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME || '/usr/local/lib/android/sdk' }}
        run: bash build-android.sh

      - name: Show what was produced
        run: |
          ls -l dist/
          file dist/veritpath-android-* || true

      # Android aborts a static binary whose PT_TLS alignment is 8, and refuses
      # anything that is not PIE. Verify both so a regression fails here rather
      # than on a user's phone.
      - name: Verify the binaries Android will actually load
        run: |
          rc=0
          for f in dist/veritpath-android-*; do
            [ -f "$f" ] || continue
            echo "--- $f"
            python3 tools/elf_fix.py --check "$f" || rc=1
          done
          exit $rc

      - uses: actions/upload-artifact@v4
        with:
          name: veritpath-android
          path: dist/veritpath-android-*
          if-no-files-found: warn


  # The portability job exists because of a real failure: sources that rely on
  # a -D_GNU_SOURCE flag in one script break under any other build path
  # (PATH_MAX, strtok_r, symlink, readlink, lstat all vanish under -std=c11).
  # The macros are now defined in the sources, and this proves it.
  portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile under several standards, warnings are errors
        run: |
          for std in c99 c11 c17 gnu99 gnu11 gnu17; do
            echo "--- -std=$std"
            cc -O2 -std=$std -Wall -Wextra -Werror -Isrc src/*.c -lz -o /tmp/vp-$std
          done
      - name: Without any feature-test macro on the command line
        run: cc -O2 -std=c11 -Wall -Wextra -Werror -Isrc src/*.c -lz -o /tmp/vp-plain
      - name: And with macros that duplicate the in-source ones
        run: |
          cc -O2 -std=c11 -D_GNU_SOURCE -Wall -Wextra -Werror -Isrc src/*.c -lz -o /tmp/vp-g
          cc -O2 -std=c17 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -Isrc src/*.c -lz -o /tmp/vp-p

  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static and shared library targets
        run: |
          make lib
          make lib-shared
          ls -l build/libveritpath.a build/libveritpath.so

      # No NDK here: tools/make_stub_jni.py provides a minimal jni.h so the
      # binding still gets compiled and actually exercised.
      - name: JNI binding compiles and runs the CLI
        run: bash tools/test_jni.sh

      # Guards the exact mistake a downstream dev hit: images passed as bare
      # positionals, which the CLI silently ignored.
      - name: Captured output includes stderr
        run: bash tools/test_capture.sh

      - name: Java wrapper matches the JNI layer
        run: python3 tools/check_java.py jni/dev/veritpath/Veritpath.java jni/veritpath_jni.c

      - name: A bare image path still works
        run: |
          make
          python3 -c "import sys; sys.path.insert(0,'tests'); import imgkit; imgkit.cmd_images('/tmp/vp_ci')"
          ./build/veritpath analyze --brief /tmp/vp_ci/init_boot.img | grep -q '^TARGET:init_boot$'
          ./build/veritpath inject /tmp/vp_ci/init_boot.img -p payloads/example-su -o /tmp/vp_ci/out
          ./build/veritpath verify /tmp/vp_ci/out/init_boot.veritpath.img | grep -q '^VERDICT:OK$' 

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: |
          make
          bash tests/run.sh build/veritpath

      - name: Universal binary
        run: |
          mkdir -p dist
          cc -O2 -std=c11 -Wall -Wextra -Isrc -arch x86_64 src/*.c -lz \
             -o dist/veritpath-macos-x86_64
          cc -O2 -std=c11 -Wall -Wextra -Isrc -arch arm64  src/*.c -lz \
             -o dist/veritpath-macos-arm64
          lipo -create -output dist/veritpath-macos-universal \
               dist/veritpath-macos-x86_64 dist/veritpath-macos-arm64
          lipo -info dist/veritpath-macos-universal

      - uses: actions/upload-artifact@v4
        with:
          name: veritpath-macos
          path: dist/veritpath-macos-*
