name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: make CC=${{ matrix.cc }}
      - name: regression tests
        run: bash tests/run.sh build/veritpath
      - name: build strictly (warnings as errors)
        run: make clean && make CC=${{ matrix.cc }} CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror"

  static:
    name: static linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make static
      - run: file build/veritpath
      - uses: actions/upload-artifact@v4
        with:
          name: veritpath-linux-x86_64-static
          path: build/veritpath

  android:
    name: android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
      - name: cross build
        run: bash build-android.sh ${{ matrix.abi }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - run: ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: veritpath-android-${{ matrix.abi }}
          path: dist/veritpath-android-${{ matrix.abi }}
