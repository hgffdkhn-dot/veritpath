name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  linux:
    name: linux static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make static
      - run: mkdir -p artifacts && cp build/veritpath artifacts/veritpath-linux-x86_64-static
      - uses: actions/upload-artifact@v4
        with:
          name: veritpath-linux-x86_64-static
          path: artifacts/veritpath-linux-x86_64-static

  macos:
    name: macos ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-13
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - run: make
      - run: bash tests/run.sh build/veritpath
      - run: mkdir -p artifacts && cp build/veritpath artifacts/veritpath-macos-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: veritpath-macos-${{ matrix.arch }}
          path: artifacts/veritpath-macos-${{ matrix.arch }}

  android:
    name: android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
      - run: bash build-android.sh ${{ matrix.abi }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - run: mkdir -p artifacts && cp dist/veritpath-android-${{ matrix.abi }} artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: veritpath-android-${{ matrix.abi }}
          path: artifacts/veritpath-android-${{ matrix.abi }}

  source:
    name: source tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p artifacts
          tar czf artifacts/veritpath-src.tar.gz \
            --exclude=.git --exclude=build --exclude=dist \
            src tests Makefile build-android.sh README.md
      - uses: actions/upload-artifact@v4
        with:
          name: veritpath-src
          path: artifacts/veritpath-src.tar.gz

  release:
    name: publish
    needs: [linux, macos, android, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: veritpath ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
