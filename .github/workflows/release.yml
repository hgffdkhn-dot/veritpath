name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: tag to build
        required: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static linux binaries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64
          mkdir -p dist
          cc -O2 -std=c11 -Wall -Wextra -Isrc src/*.c -lz -static -o dist/veritpath-linux-x86_64
          x86_64-linux-gnu-gcc -O2 -std=c11 -Isrc src/*.c -lz -static -o dist/veritpath-linux-x86_64
          aarch64-linux-gnu-gcc -O2 -std=c11 -Isrc src/*.c -lz -static -o dist/veritpath-linux-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: veritpath-linux
          path: dist/veritpath-linux-*

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64
      - name: Cross-compile for Windows
        run: |
          mkdir -p dist
          x86_64-w64-mingw32-gcc -O2 -std=c11 -Isrc src/*.c -lz -static \
            -o dist/veritpath-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: veritpath-windows
          path: dist/veritpath-windows-*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttl/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
      - env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash build.sh android
      - uses: actions/upload-artifact@v4
        with:
          name: veritpath-android
          path: dist/veritpath-android-*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Universal macOS binary
        run: |
          mkdir -p dist
          cc -O2 -std=c11 -Isrc -arch x86_64 src/*.c -lz -o dist/veritpath-macos-x86_64
          cc -O2 -std=c11 -Isrc -arch arm64  src/*.c -lz -o dist/veritpath-macos-arm64
          lipo -create -output dist/veritpath-macos-universal dist/veritpath-macos-x86_64 dist/veritpath-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: veritpath-macos
          path: dist/veritpath-macos-*

  release:
    needs: [linux, windows, android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          cd out && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: out/*
