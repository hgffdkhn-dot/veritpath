name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: binary (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: veritpath-linux-x86_64
          - os: macos-13
            asset: veritpath-macos-x86_64
          - os: macos-latest
            asset: veritpath-macos-arm64
          - os: windows-latest
            asset: veritpath-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller .
      - name: build
        shell: bash
        run: bash scripts/build.sh dist
      - name: package
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -f dist/veritpath.exe ]; then
            cp dist/veritpath.exe "artifacts/${{ matrix.asset }}"
          else
            cp dist/veritpath "artifacts/${{ matrix.asset }}"
            chmod +x "artifacts/${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: artifacts/${{ matrix.asset }}

  sdist:
    name: sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  release:
    name: publish github release
    needs: [build, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: veritpath ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
